async function persist(){
 if(S.preview){
  BASE={students:cloneRows(ALL.students),att:cloneRows(ALL.att)};
  S.notice="Prototipo sin conexión: los cambios solo duran mientras esta pestaña permanezca abierta.";
  return true;
 }
 const target={students:cloneRows(ALL.students),att:cloneRows(ALL.att)};
 syncQueue=syncQueue.then(async()=>{
  if(!db||!S.user)throw new Error("Inicia sesión para guardar los cambios.");
  const removedAtt=BASE.att.filter(a=>!target.att.some(b=>b.id===a.id)).map(a=>a.id).filter(Boolean);
  const changedAtt=target.att.filter(a=>!BASE.att.some(b=>b.id===a.id&&sameRow(a,b)));
  const removedStudents=BASE.students.filter(a=>!target.students.some(b=>b.id===a.id)).map(a=>a.id);
  const changedStudents=target.students.filter(a=>!BASE.students.some(b=>b.id===a.id&&sameRow(a,b)));
  if(removedAtt.length){const {error}=await db.from("attendance").delete().in("id",removedAtt);if(error)throw error}
  if(changedAtt.length){const {error}=await db.from("attendance").upsert(changedAtt);if(error)throw error}
  if(changedStudents.length){const {error}=await db.from("students").upsert(changedStudents);if(error)throw error}
  if(removedStudents.length){const {error}=await db.from("students").delete().in("id",removedStudents);if(error)throw error}
  BASE={students:cloneRows(target.students),att:cloneRows(target.att)};
  S.err="";
 }).catch(error=>{S.err="No se pudo guardar: "+(error.message||"error desconocido");render();return false});
 return syncQueue;
}

function periodWeeks(period){
 if(!period)return[];
 const weeks=[];let cursor=period.start;
 while(cursor<=period.end){
  while(cursor<=period.end&&isoDay(cursor)>5)cursor=dateAdd(cursor,1);
  if(cursor>period.end)break;
  const end=dateAdd(cursor,5-isoDay(cursor));

  weeks.push({start:cursor,end:weekEnd});
  cursor=dateAdd(weekEnd,1);
 }
 return weeks;
}

async function saveAttendanceScopes(scopes){
 while(attendanceSaveInFlight)await attendanceSaveInFlight;
 const scopeSet=new Set(scopes),pending=[...S.pendingAttendance.entries()].filter(([,record])=>record&&scopeSet.has(attendanceScopeKey(record.class_id||"general",record.date,record.year)));
 if(!pending.length)return true;
 const activeScopes=new Set(pending.map(([,record])=>attendanceScopeKey(record.class_id||"general",record.date,record.year)));
 const pendingKeys=new Set(pending.map(([key])=>key)),original=cloneRows(ALL.att.filter(record=>pendingKeys.has(attendanceKey(record))));
 activeScopes.forEach(scope=>{
  const timer=S.attendanceSaveTimers.get(scope);if(timer)clearTimeout(timer);
  S.attendanceSaveTimers.delete(scope);S.savingAttendanceScopes.add(scope);
  S.attendanceSaveState.set(scope,"saving");S.attendanceSaveErrors.delete(scope);
 });
 S.err="";render();
 const saveTask=(async()=>{
  pending.forEach(([key,record])=>{
   const index=ALL.att.findIndex(item=>attendanceKey(item)===key);
   if(record.status===null){if(index>=0)ALL.att.splice(index,1)}
   else if(index>=0)ALL.att[index]={...ALL.att[index],...record};
   else ALL.att.push({...record});
  });
  const saved=await persist();
  const errorMessage=saved?"":S.err.replace(/^No se pudo guardar:\s*/,"").slice(0,240)||"No se recibió confirmación del servidor.";
  activeScopes.forEach(scope=>S.savingAttendanceScopes.delete(scope));
  if(saved){
   pending.forEach(([key,record])=>{if(S.pendingAttendance.get(key)===record)S.pendingAttendance.delete(key)});
   activeScopes.forEach(scope=>{
    S.attendanceSaveErrors.delete(scope);
     const remains=[...S.pendingAttendance.values()].some(record=>record&&attendanceScopeKey(record.class_id||"general",record.date,record.year)===scope);
     S.attendanceSaveState.set(scope,remains?"pending":"saved");
    });
  }else{
   ALL.att=ALL.att.filter(record=>!pendingKeys.has(attendanceKey(record))).concat(original);
   activeScopes.forEach(scope=>{
    S.attendanceSaveErrors.set(scope,errorMessage);
    S.attendanceSaveState.set(scope,"error");
   });
  }
  load();
  return saved;
 })();
 attendanceSaveInFlight=saveTask;
 try{return await saveTask}
 finally{if(attendanceSaveInFlight===saveTask)attendanceSaveInFlight=null}
}

async function replicateClassStatuses(itemId,date,grade){
 const source=S.settings.schedule.find(item=>item.id===itemId);
 if(!source||!grade||!source.grades.includes(grade))return;
 const students=classStudents(source,grade);
 const sourceStatuses=new Map(students.map(student=>[student.id,cur(student.id,source.id,date,source.subject)]).filter(([,status])=>status));
 if(!sourceStatuses.size){alert("Primero registra la asistencia de esta clase para poder replicarla.");return}
 const targets=classesForDate(date,grade).filter(item=>item.id!==source.id);
 if(!targets.length){alert("No hay otras materias programadas para este grado en este día.");return}
 const copies=[],existing=[];
 targets.forEach(target=>students.forEach(student=>{
  const status=sourceStatuses.get(student.id);
  if(!status)return;
  const found=cur(student.id,target.id,date,target.subject);
  if(found)existing.push(student.id);
  else copies.push({student_id:student.id,subject:target.subject,date,year:S.year,period:periodFor(date,S.settings.periods),class_id:target.id,status});
 }));
 if(!copies.length){alert("No hay estados nuevos para replicar. Los registros existentes se conservaron.");return}
 const targetNames=targets.map(item=>item.subject+" ("+item.slots.map(slot=>slot+".ª").join(", ")+")").join(", ");
 const skipped=existing.length;
 if(!confirm("Se copiarán "+copies.length+" "+(copies.length===1?"estado":"estados")+" de "+grade+" a: "+targetNames+".\n\nLos estados que ya existan en esas clases no se modificarán"+(skipped?" ("+skipped+" registros protegidos).":"")+" ¿Continuar?"))return;
 copies.forEach(record=>stageAttendance(record,record.status));
 const scopes=[...new Set(copies.map(record=>attendanceScopeKey(record.class_id,record.date,record.year)))];
 const saved=await saveAttendanceScopes(scopes);
 const failedScopes=scopes.filter(scope=>S.attendanceSaveErrors.has(scope));
 const errorDetail=failedScopes.map(scope=>S.attendanceSaveErrors.get(scope)).find(Boolean);
 S.notice=saved
  ?"Lista replicada y guardada en "+scopes.length+" "+(scopes.length===1?"clase":"clases")+" ("+copies.length+" "+(copies.length===1?"registro":"registros")+")."+(skipped?" Se conservaron "+skipped+" estados existentes.":"")
  :"No se pudo confirmar la réplica en "+failedScopes.length+" "+(failedScopes.length===1?"clase":"clases")+". Los cambios siguen pendientes en esta pestaña; reintenta el guardado. "+(errorDetail||"");
 render();
}

function weeklyAbsenceRows(records,year,month,status="F",period=selectedPeriod()){
 const monthStart=year+"-"+month+"-01",monthEnd=year+"-"+month+"-"+String(new Date(Number(year),Number(month),0).getDate()).padStart(2,"0");
 const rangeStart=period&&period.start>monthStart?period.start:monthStart;
 const rangeEnd=period&&period.end<monthEnd?period.end:monthEnd;
 const weeks=[];
 let start=rangeStart;
 while(start<=rangeEnd&&isoDay(start)>5)start=dateAdd(start,8-isoDay(start));
 while(start<=rangeEnd){
  const end=dateAdd(start,7-isoDay(start)),to=end>rangeEnd?rangeEnd:end;
  const rows=records.filter(record=>record.date>=start&&record.date<=to);
  const counts=Object.fromEntries(Object.keys(ST).map(key=>[key,cnt(rows,key)]));
  weeks.push({label:"Sem. "+(weeks.length+1),from:start,to,counts,count:status==="all"?Object.values(counts).reduce((sum,value)=>sum+value,0):counts[status]});
  start=dateAdd(to,1);
  while(start<=rangeEnd&&isoDay(start)>5)start=dateAdd(start,8-isoDay(start));
 }
 return weeks;
}

  svg+='<text x="'+(left+slot*(index+.5))+'" y="'+(H-22)+'" font-size="10" font-weight="700" text-anchor="middle" fill="var(--mut)">'+week.label+'</text><text x="'+(left+slot*(index+.5))+'" y="'+(H-8)+'" font-size="9" text-anchor="middle" fill="var(--mut)">'+esc(shortDate(week.from)+"–"+shortDate(week.to))+'</text>';
 });
 svg+="</svg>";
 const totals=chartKeys.map(key=>weeks.reduce((sum,week)=>sum+week.counts[key],0));
 const total=totals.reduce((sum,value)=>sum+value,0);
 const phrase=status==="all"?"registros en todos los estados":({A:"asistencias",F:"faltas",E:"evasiones",R:"retardos",N:"excusas no justificadas",J:"excusas justificadas"}[status]||"registros");
 const legend='<div class="sum">'+chartKeys.map((key,index)=>'<span style="border-left:4px solid '+ST[key].c+'">'+esc(ST[key].s)+' · '+totals[index]+'</span>').join("")+"</div>";
 return '<p class="chart-caption">'+esc(month)+' · '+total+' '+phrase+'. Barras agrupadas por semana: cada color representa un estado y el número sobre cada barra es su cantidad.</p>'+svg+legend;

function downloadSummaryCsv(){
 const grade=S.summaryGrade,period=S.summaryPeriod;
 const subjects=Object.keys(SUBS).filter(subject=>subject!=="all");
 const periodInfo=S.settings.periods.find(item=>item.period===period);
 const students=S.students.filter(student=>student.grade===grade).sort((a,b)=>a.name.localeCompare(b.name));
 const studentIds=new Set(students.map(student=>student.id));
 const records=S.att.filter(record=>studentIds.has(record.student_id)&&attendancePeriod(record)===period);
 const cell=value=>'"'+String(value==null?"":value).replace(/"/g,'""')+'"';
 const rows=[
  ["Informe de asistencia por periodo","Grado",grade,"Año",S.year,"Periodo","P"+period],
  ["Fechas",periodInfo?periodInfo.start+" a "+periodInfo.end:"No configuradas"],
  ["Estudiante",...Object.keys(ST).map(status=>ST[status].s),...subjects.map(subject=>"Faltas · "+SUBS[subject].n),"Total registros","Total faltas"]
 ];
 students.forEach(student=>{
  const studentRecords=records.filter(record=>record.student_id===student.id);
  const stateCounts=Object.keys(ST).map(status=>cnt(studentRecords,status));
  const absenceCounts=subjects.map(subject=>studentRecords.filter(record=>record.status==="F"&&record.subject===subject).length);
  rows.push([student.name,...stateCounts,...absenceCounts,stateCounts.reduce((sum,count)=>sum+count,0),absenceCounts.reduce((sum,count)=>sum+count,0)]);
 });
 const totalsByStatus=Object.keys(ST).map(status=>cnt(records,status));
 const totalsBySubject=subjects.map(subject=>records.filter(record=>record.status==="F"&&record.subject===subject).length);
 rows.push(["Total del grado",...totalsByStatus,...totalsBySubject,records.length,totalsBySubject.reduce((sum,count)=>sum+count,0)]);
 const csv="\uFEFF"+rows.map(row=>row.map(cell).join(";")).join("\r\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob),link=document.createElement("a");
 link.href=url;link.download="asistencia_"+S.year+"_P"+period+"_"+grade.replace("°","").replace(/\s/g,"")+".csv";
 document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function qrApi(action,payload){
 const {data,error}=await db.auth.getSession();
 if(error)throw error;
 if(!data.session)throw new Error("La sesión expiró. Inicia sesión de nuevo.");
 const response=await fetch("/api/qr",{
  method:"POST",
  headers:{"Content-Type":"application/json",Authorization:"Bearer "+data.session.access_token},
  body:JSON.stringify({action,...payload})
 });
 const result=await response.json();
 if(!response.ok)throw new Error(result.error||"No se pudo completar la operación QR.");
 return result;
}

function collectPeriods(){
 const periods=[1,2,3,4].map(period=>({
  period,
  start:$("#p-start-"+period).value,
  end:$("#p-end-"+period).value
 }));
 if(periods.every(p=>!p.start&&!p.end))return[];
 if(periods.some(p=>!p.start||!p.end))throw new Error("Completa las fechas de inicio y fin de los cuatro periodos.");
 for(const p of periods){
  if(p.start.slice(0,4)!==String(S.year)||p.end.slice(0,4)!==String(S.year))
   throw new Error("Las fechas de los periodos deben pertenecer al año "+S.year+".");
  if(p.start>p.end)throw new Error("La fecha de inicio no puede ser posterior a la fecha de fin.");
 }
 const ordered=periods.slice().sort((a,b)=>a.start.localeCompare(b.start));
 if(ordered.some((p,i)=>i>0&&p.start<=ordered[i-1].end))
  throw new Error("Los periodos no pueden cruzarse. Deja los días de receso fuera de los rangos.");
 return periods;
}

 else if(a==="replicate-day"){await replicateClassStatuses(b.dataset.class,b.dataset.date,b.dataset.grade)}
 else if(a==="save-hour"){await saveAttendanceChanges(b.dataset.class,b.dataset.date)}
 else if(a==="save-pending"){const scopes=[...new Set([...S.pendingAttendance.values()].filter(Boolean).map(record=>attendanceScopeKey(record.class_id||"general",record.date,record.year)))];await saveAttendanceScopes(scopes)}
 else if(a==="st"){setStatus(v,b.dataset.k)}
 else if(a==="edit"){S.edit=v;render()}
 else if(a==="eclose"){S.edit=null;render()}
 else if(a==="scan"){scanStart()}
 else if(a==="scanx"){scanStop()}
 else if(a==="cards"){S.cards=true;render()}
 else if(a==="cclose"){S.cards=false;render()}
 else if(a==="cprint"){window.print()}
 else if(a==="esave"){const x=ALL.students.find(y=>y.id===S.edit),nm=$("#en").value.trim();if(x&&nm){x.name=nm;x.grade=$("#eg").value;persist()}S.edit=null;load()}
 else if(a==="teacher"){S.modal=true;render()}
 else if(a==="close"){S.modal=false;render()}
 else if(a==="schedule"){S.scheduleModal=true;S.editingClass=null;S.notice="";render()}
 else if(a==="schedule-close"){S.scheduleModal=false;S.editingClass=null;render()}
 else if(a==="class-edit"){S.editingClass=v;render()}
 else if(a==="class-cancel"){S.editingClass=null;render()}
 else if(a==="class-save"){try{saveClassEditor()}catch(error){showError(error)}}
 else if(a==="class-delete"){if(confirm("¿Quitar esta clase del horario?")){S.settings.schedule=S.settings.schedule.filter(x=>x.id!==v);if(S.activeClass===v)S.activeClass=null;render()}}
 else if(a==="schedule-copy"){S.settings.schedule=SCHEDULE_2026.map((x,i)=>({...x,id:S.year+"-class-"+(i+1),slots:[...x.slots],grades:[...x.grades]}));S.editingClass=null;S.notice="Horario base copiado. Ajusta los grupos y guarda los cambios.";render()}
 else if(a==="settings-save"){try{S.settings.periods=collectPeriods();await saveSettings();S.notice="Horario y periodos guardados para "+S.year+".";render()}catch(error){showError(error)}}
 else if(a==="add"){addStudent($("#nn").value,$("#ng").value)}
 else if(a==="seed"){seed()}
 else if(a==="promote"){promote()}
 else if(a==="del"){if(confirm("¿Eliminar a "+b.dataset.n+" y toda su asistencia?"))delStudent(v)}
 else if(a==="logout"){db.auth.signOut().then(({error})=>{if(error)loginRender(error.message)}).catch(error=>loginRender(error.message))}
});
document.addEventListener("submit",async e=>{
 if(e.target.id!=="login-form")return;
 e.preventDefault();
 const button=e.target.querySelector('button[type="submit"]');
 button.disabled=true;button.textContent="Ingresando…";
 try{
  const {data,error}=await db.auth.signInWithPassword({
   email:$("#login-email").value.trim(),
   password:$("#login-password").value
  });
  if(error)throw error;
  if((data.user.email||"").toLowerCase()!==TEACHER_EMAIL){
   await db.auth.signOut();
   loginRender("Este sistema está habilitado únicamente para "+TEACHER_EMAIL+".");
   return;
  }
  S.user=data.user;
  await reloadFromServer();
 }catch(error){await returnToLogin(error)}
});
startApp();
</script></body></html>
